name: Application checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:studio
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        scope: [all, production]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Audit dependencies
        run: npm run --silent audit:${{ matrix.scope }} -- --json > audit-${{ matrix.scope }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-audit-${{ matrix.scope }}
          path: audit-${{ matrix.scope }}.json
          retention-days: 7
  deploy-production:
    name: Migrate database and deploy production
    needs: [application, dependency-audit]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    concurrency:
      group: production-deployment
      cancel-in-progress: false
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Require deployment credentials
        shell: bash
        run: |
          for name in SUPABASE_DB_URL VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Configure $name in GitHub's production environment. See docs/deployment.md."
              exit 1
            fi
          done
      - name: Reject a superseded revision
        shell: bash
        run: |
          latest=$(git ls-remote origin refs/heads/main | cut -f1)
          if [[ "$latest" != "$GITHUB_SHA" ]]; then
            echo "::error::A newer main revision exists. Deploy the latest workflow run instead."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.118.0
      - run: npm ci
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Pull production build settings
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build production artifacts before changing the database
        run: vercel build --prod --token="$VERCEL_TOKEN"
      - name: Review pending migrations
        run: supabase db push --db-url "$SUPABASE_DB_URL" --dry-run
      - name: Apply pending migrations
        run: supabase db push --db-url "$SUPABASE_DB_URL" --yes
      - name: Deploy the checked revision
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
