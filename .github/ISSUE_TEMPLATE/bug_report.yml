name: Bug report
description: Something in GuildOS is broken or behaves unexpectedly.
title: "fix: "
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please search [existing issues](https://github.com/S07K/guildos/issues) first.
        **Never paste API keys, `.env` values, vault keys or other secrets.** Security issues belong in a [private advisory](https://github.com/S07K/guildos/security/advisories/new).
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the studio at /studio
        2. Create a project and ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Studio board / editor
        - Agent pipeline / worker
        - Model connections (BYOK, ChatGPT, Claude, Groq, OpenRouter)
        - Authentication
        - Export / share links
        - Marketing site / blog
        - AI sign-in service (apps/ai-signin)
        - Database migrations
        - Local setup / tooling
        - Other
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Where did it happen?
      options:
        - Local development (npm run dev)
        - Self-hosted deployment
        - guildos.design
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or version
      description: Output of `git rev-parse --short HEAD`, if running from source.
  - type: input
    id: runtime
    attributes:
      label: Browser, OS and Node.js version
      placeholder: Chrome 131, macOS 15, Node.js 24.1
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Relevant console output or screenshots. Redact anything sensitive.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I removed any secrets or personal data from this report.
          required: true
